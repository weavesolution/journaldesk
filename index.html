<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123c4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JournalDesk Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="JournalDesk">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- setup -->
  <section id="setup" class="screen hidden">
    <div class="setup-card">
      <div class="brand"><img src="jd_logo.png" alt="JD" class="setup-logo"><div><h1>JournalDesk</h1>
        <div class="muted small">Mobile</div></div></div>
      <p class="muted">View your books anywhere – balances, ledgers, day book and reports, as of your last sync.</p>
      <label>Sync URL
        <input id="s-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
      </label>
      <label>Secret key
        <input id="s-key" type="password" autocomplete="off" autocapitalize="characters" placeholder="JD-XXXX-XXXX-XXXX-XXXX">
      </label>
      <button id="s-go" class="btn primary">Save &amp; Load Data</button>
      <p id="s-err" class="err"></p>
      <button id="s-cancel" class="btn hidden" style="width:100%;margin-top:8px">Cancel</button>
      <p class="muted small">The Sync URL is filled in automatically when you open the link shared from JournalDesk.
        The secret key is shown in JournalDesk (F12 → Sync &amp; Mobile).</p>
      <div class="credit">Developed by <a href="https://weavesolution.com" target="_blank" rel="noopener">
        <img src="weave_logo.png" alt="Weave Solutions"></a></div>
    </div>
  </section>

  <!-- main -->
  <section id="main" class="screen hidden">
    <header class="top">
      <img src="jd_logo.png" alt="JD" class="top-logo">
      <div class="top-text">
        <div id="h-company" class="company"></div>
        <div id="h-sync" class="synced"></div>
      </div>
      <button id="install" class="install-btn hidden">Install</button>
      <button id="bell" class="icon-btn" aria-label="Alerts">
        <svg viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
        <span id="bell-n" class="bell-n hidden">0</span>
      </button>
      <button id="add" class="icon-btn add-btn hidden" aria-label="Add">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
      <button id="share" class="icon-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M18 16.1c-.8 0-1.5.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9-1.2-2.9-2.8-2.9z"/></svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="menu" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
      </button>
    </header>
    <div id="toast" class="toast hidden"></div>
    <main id="view"></main>
    <nav class="tabs">
      <button data-tab="home" class="active"><span>🏠</span>Home</button>
      <button data-tab="accounts"><span>👥</span>Accounts</button>
      <button data-tab="daybook"><span>📒</span>Day Book</button>
      <button data-tab="reports"><span>📊</span>Reports</button>
    </nav>
  </section>
  <div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheet-body"></div></div>
</div>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
